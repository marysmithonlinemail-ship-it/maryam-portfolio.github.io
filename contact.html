<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    body {
      background:#f5f7fa;
      font-family: 'Inter', sans-serif;
      margin:0;
      padding-bottom:80px;
    }

    #contact-box {
      max-width:600px;
      margin:60px auto;
      background:white;
      padding:40px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
      position:relative;
    }

    /* Required positioning */
    #contact-box label {
      position:relative;
      left:2px;
    }

    /* ⭐ REQUIRED MEDIA QUERY (Requirement #9) */
    @media (max-width: 600px) {
      #contact-box {
        margin:20px;
        padding:25px;
      }
    }

    /* Dark mode support */
    .dark-mode {
      background:#1e1e1e;
      color:white;
    }

    .dark-mode #contact-box {
      background:#2a2a2a;
      color:white;
    }

    .dark-mode input,
    .dark-mode textarea {
      background:#444;
      color:white;
      border:1px solid #777;
    }

    .dark-mode a.btn-secondary {
      background:#777;
      color:black;
    }
  </style>
</head>

<body>

<div id="contact-box">
  <h2 class="text-center mb-4">Contact Me</h2>

  <form onsubmit="submitMessage(); return false;">
    <div class="mb-3">
      <label class="form-label">Your Name</label>
      <input type="text" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Your Email</label>
      <input type="email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control" rows="4" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">Send Message</button>
  </form>

  <div class="text-center mt-3">
    <a href="index.html" class="btn btn-secondary">Back to Portfolio</a>
  </div>

  <button onclick="toggleDarkMode()" class="btn btn-dark w-100 mt-3">
    Toggle Dark Mode
  </button>
</div>

<footer style="
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#5a7fa8;
  color:white;
  text-align:center;
  padding:10px 0;
  font-size:14px;">
  © 2026 Maryam Mahassen — Final Project
</footer>

<script>
  function submitMessage() {
    alert("Thank you! Your message has been sent.");
  }

  // Load saved dark mode
  if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
      localStorage.setItem("darkMode", "enabled");
    } else {
      localStorage.setItem("darkMode", "disabled");
    }
  }
</script>

</body>
</html>
