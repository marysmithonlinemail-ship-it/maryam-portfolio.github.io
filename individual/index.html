<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Individual Assignments</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
    }

    .container {
      max-width: 850px;
      margin: 60px auto;
      background: white;
      padding: 45px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #222;
    }

    .list a {
      display: block;
      background: #5a7fa8;
      color: white;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
      text-decoration: none;
      text-align: center;
      transition: 0.25s ease;
    }

    .list a:hover {
      background: #4a6b8f;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Individual Assignments</h1>

    <div class="list">
      <a href="../individual1/index.html">Individual Assignment 1</a>
      <a href="../individual2/index.html">Individual Assignment 2</a>
      <a href="../individual3/index.html">Individual Assignment 3</a>
      <a href="../individual4/index.html">Individual Assignment 4</a>
    </div>
  </div>
<footer style="
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#5a7fa8;
  color:white;
  text-align:center;
  padding:10px 0;
  font-size:14px;">
  © 2026 Maryam Mahassen — Final Project
</footer>
<script>
    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark-mode");
    }
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
      if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("darkMode", "enabled");
      } else {
        localStorage.setItem("darkMode", "disabled");
      }
    }
  </script>
  <style>
    .dark-mode {
      background:#1e1e1e;
      color:white;
    }
    
    .dark-mode .container {
      background:#2a2a2a;
      color:white;
    }
    
    .dark-mode nav {
      background:#333;
      border-bottom:1px solid #555;
    }
    
    .dark-mode a.button {
      background:#777;
    }
    
    .dark-mode p,
    .dark-mode h1,
    .dark-mode h2 {
      color: white;
    }
    
    .dark-mode a.button {
      color: black;
      background: #ddd;
    }
    
    .dark-mode .flex-item {
      color: black !important;
      background: #d9e3f2;
    }
    
    .dark-mode #highlight-box {
      color: black !important;
      background:#e8f0ff;
    }
  </style>
</body>
</html>
