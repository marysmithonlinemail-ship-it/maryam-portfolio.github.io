<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
    }

    .container {
      max-width: 850px;
      margin: 60px auto;
      background: white;
      padding: 45px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    p {
      font-size: 16px;
      color: #444;
      line-height: 1.7;
      text-align: center;
    }

    .button {
      display: inline-block;
      background: #5a7fa8;
      color: white;
      padding: 12px 20px;
      margin-top: 25px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .button:hover {
      background: #4a6b8f;
    }

    .center {
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Contact Me</h1>

    <p>If you have any questions about my work or assignments, feel free to reach out.</p>

    <p><strong>Email:</strong> maryammahassen@gmail.com</p>

    <div class="center">
      <a href="index.html" class="button">Back to Portfolio</a>
    </div>
  </div>
<script>
    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark-mode");
    }
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
      if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("darkMode", "enabled");
      } else {
        localStorage.setItem("darkMode", "disabled");
      }
    }
  </script>
  <style>
    .dark-mode {
      background:#1e1e1e;
      color:white;
    }
    
    .dark-mode .container {
      background:#2a2a2a;
      color:white;
    }
    
    .dark-mode nav {
      background:#333;
      border-bottom:1px solid #555;
    }
    
    .dark-mode a.button {
      background:#777;
    }
    
    .dark-mode p,
    .dark-mode h1,
    .dark-mode h2 {
      color: white;
    }
    
    .dark-mode a.button {
      color: black;
      background: #ddd;
    }
    
    .dark-mode .flex-item {
      color: black !important;
      background: #d9e3f2;
    }
    
    .dark-mode #highlight-box {
      color: black !important;
      background:#e8f0ff;
    }
  </style>
</body>
</html>
