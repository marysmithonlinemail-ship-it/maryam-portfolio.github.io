<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Practice Activity 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
  }

  .container {
    max-width: 850px;
    margin: 60px auto;
    background: white;
    padding: 45px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  h1 {
    text-align: center;
    font-weight: 600;
    margin-bottom: 20px;
    color: #222;
  }

  p {
    color: #444;
    line-height: 1.7;
    margin-bottom: 20px;
    font-size: 16px;
  }

  img {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin: 30px auto;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }

  a {
    display: inline-block;
    margin-top: 25px;
    text-decoration: none;
    color: #003d99;
    font-weight: 500;
    padding: 12px 18px;
    border-radius: 6px;
    background: #e9f0ff;
    transition: 0.2s ease;
  }

  a:hover {
    background: #d8e4ff;
  }
  
  .right-button {
    float: right;
    margin-left: 10px;
  }
</style>

</head>
<body>

  <div class="container">
    <h1>Practice Activity 3</h1>
    <p>This is what Practice Activity 3 looks like.</p>
    <img src="practice3.png" width="1000">
    
     <a class="right-button" href="../practice/index.html">Back to Practice Activities</a>
    <a href="../index.html">Back to Portfolio</a>
  </div>
<footer style="
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#5a7fa8;
  color:white;
  text-align:center;
  padding:10px 0;
  font-size:14px;">
  © 2026 Maryam Mahassen — Final Project
</footer>
<script>
    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark-mode");
    }
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
      if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("darkMode", "enabled");
      } else {
        localStorage.setItem("darkMode", "disabled");
      }
    }
  </script>
  <style>
    .dark-mode {
      background:#1e1e1e;
      color:white;
    }
    
    .dark-mode .container {
      background:#2a2a2a;
      color:white;
    }
    
    .dark-mode nav {
      background:#333;
      border-bottom:1px solid #555;
    }
    
    .dark-mode a.button {
      background:#777;
    }
    
    .dark-mode p,
    .dark-mode h1,
    .dark-mode h2 {
      color: white;
    }
    
    .dark-mode a.button {
      color: black;
      background: #ddd;
    }
    
    .dark-mode .flex-item {
      color: black !important;
      background: #d9e3f2;
    }
    
    /* ⭐ KEEP HIGHLIGHT BOX TEXT BLACK IN DARK MODE */
    .dark-mode #highlight-box {
      color: black !important;
      background:#e8f0ff;
    }
  </style>
</body>

</html>
